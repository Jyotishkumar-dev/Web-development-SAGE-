<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Image Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f4f9;
            font-family: Arial, sans-serif;
        }

        .gallery {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
            transition: 0.3s ease;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 15px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            margin-top: 20px;
            font-size: 28px;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Aesthetic Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/400/300?random=1" alt="Image 1">
        <img src="https://picsum.photos/400/300?random=2" alt="Image 2">
        <img src="https://picsum.photos/400/300?random=3" alt="Image 3">
        <img src="https://picsum.photos/400/300?random=4" alt="Image 4">
        <img src="https://picsum.photos/400/300?random=5" alt="Image 5">
    </div>

</body>
</html>
